- slug: sentsplit
  title: sentsplit
  description: A flexible sentence segmentation library using CRF model and regex rules
  image: img/sentsplit.jpg
  url: https://github.com/zaemyung/sentsplit
  category: current
  body_html: |-
    <p>Working in the field of natural language processing, I am often faced with the task of segmenting a text passage into multiple sentences.</p>
    <p><a href="https://github.com/zaemyung/sentsplit" target="_blank" rel="noopener"><code>sentsplit</code></a> is a sentence segmentation library for Python with the following desiderata in mind:</p>
    <ul>
      <li>Be able to extend to new languages or "types" of sentences from the data alone.</li>
      <li>But also provide functionality to segment (or not to segment) lines based on regular expression rules.</li>
      <li>Be able to reconstruct the exact original text paragraphs from joining the segmented sentences.</li>
    </ul>
    <p>The basic idea is to train and run a conditional random field model on the texts for the first pass; and apply regex rules for more control in the second pass, hopefully allowing for more flexibility.</p>
    <p>Demo of this library is available <a href="https://share.streamlit.io/zaemyung/sentsplit/main" target="_blank" rel="noopener">here</a>.</p>
