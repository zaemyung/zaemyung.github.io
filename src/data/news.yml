# News items converted from Jekyll _news/*.md (newest first). html is an inline fragment, not wrapped in <p>.
- date: "2026-09-30"
  html: 'Our work "Meta^n" 🔁 on <a href="https://arxiv.org/abs/2608.24735" target="_blank" rel="noopener">recursive self-improvement through emergent depth</a> is accepted to appear at <a href="https://neurips.cc/" target="_blank" rel="noopener">NeurIPS 2026</a>. Check out the <a href="https://arxiv.org/abs/2608.24735" target="_blank" rel="noopener">paper</a> and <a href="https://github.com/minnesotanlp/meta-n" target="_blank" rel="noopener">code</a>!'
- date: "2026-08-05"
  html: I am excited to be joining <a href="https://aws.amazon.com/" target="_blank" rel="noopener">Amazon AWS</a> as a research intern this fall, from September to December 2026.
- date: "2026-05-14"
  html: 'New preprint: "Structure Liberates" 🧠 investigates how constrained sensemaking produces more novel research output. Check out our <a href="https://minnesotanlp.github.io/SciSense" target="_blank" rel="noopener">project page</a>!'
- date: "2026-04-16"
  html: 'New preprint: "The Amazing Agent Race" 🏁 explores how AI agents excel at tool use but struggle with navigation. Check out our <a href="https://minnesotanlp.github.io/the-amazing-agent-race/" target="_blank" rel="noopener">project page</a>!'
- date: "2025-11-08"
  html: 'My internship project at Amazon AGI, "Align to Structure", has been accepted for presentation at <a href="https://aaai.org/conference/aaai/aaai-26/" target="_blank" rel="noopener">AAAI 2026</a>. Check out the <a href="https://ojs.aaai.org/index.php/AAAI/article/view/41085" target="_blank" rel="noopener">paper</a>!'
- date: "2025-05-01"
  html: I am honored to receive the Doctoral Dissertation Fellowship from the University of Minnesota, which will enable me to fully dedicate my time to advancing and completing my thesis research.
- date: "2024-06-15"
  html: Our <a href="https://arxiv.org/abs/2402.10586" target="_blank" rel="noopener">research</a> on differentiating between machine-generated and human-authored texts through the analysis of "discourse motifs" is accepted to appear at ACL 2024.
- date: "2024-06-13"
  html: I am thrilled to be interning at Amazon AGI this summer where I will be working on model alignment with discourse signals.
- date: "2023-09-25"
  html: I completed my summer internship at <a href="https://www.salesforce.org" target="_blank" rel="noopener">Salesforce</a> on developing a challenging benchmark dataset for paper citation task for large language models.
- date: "2022-10-06"
