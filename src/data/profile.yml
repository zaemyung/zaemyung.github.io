pillars:
  - num: "01"
    tag: Structure
    heading: Give language models a sense of discourse.
    blurb: >-
      Discourse-level structure as both a training signal and an analysis lens: structural alignment for coherent
      long-form generation, and discourse motifs that tell human writing from machine text.
    papers:
      - { label: Align to Structure, match: "Align to Structure" }
      - { label: Threads of Subtlety, match: "Threads of Subtlety" }
      - { label: Implicatures, match: "Pope Catholic" }
      - { label: Cross-lingual Discourse, match: "Visualizing Cross" }
  - num: "02"
    tag: Metacognition
    heading: Let models judge, and improve, themselves.
    blurb: >-
      Metacognitive feedback inside the training loop: evolving reward models, evaluators audited for cognitive bias,
      and recursive self-improvement whose layers take on emergent roles.
    papers:
      - { label: "Meta^n", match: "Recursive Self-Improvement" }
      - { label: MPO, match: "Meta Policy Optimization" }
      - { label: CoBBLEr, match: "Cognitive Biases" }
  - num: "03"
    tag: Collaboration
    heading: Build AI that writes and works alongside people.
    blurb: >-
      Interactive revision systems, sensemaking scaffolds for researchers, and benchmarks that probe how agents
      navigate real tools and tasks.
    papers:
      - { label: Amazing Agent Race, match: "Amazing Agent Race" }
      - { label: Structure Liberates, match: "Structure Liberates" }
      - { label: IteraTeR, match: "Learning Where To Edit" }
