role_line: Linguistic structure · metacognitive self-improvement · human-AI collaboration
# The thesis line reads `before` + one phrase + `after`. The first phrase is the static default (no JS, reduced motion,
# search engines); on the home page the slot rotates through all of them, one per research pillar.
thesis:
  before: I teach language models to
  phrases:
    - write with <em>structure</em>
    - judge their own <em>reasoning</em>
    - <em>recursively improve</em> themselves
    - work <em>alongside people</em>
  after: "."
lead:
  - >-
    I am a Ph.D. candidate in the <a href="https://minnesotanlp.github.io/">Minnesota NLP</a> group at the
    University of Minnesota, advised by <a href="https://dykang.github.io/">Dongyeop Kang</a>. My research develops a
    <em>meta-scaffolding</em> paradigm for large language models: discourse-level structure as a training signal for
    coherent long-form generation, metacognitive feedback inside reinforcement learning to stabilize optimization, and
    test-time metacognition that lets agents recursively improve themselves.
  - >-
    Before the Ph.D. I worked on machine translation at <a href="https://europe.naverlabs.com/">NAVER LABS Europe</a>
    and <a href="https://papago.naver.com/">Papago</a>, and I have interned at
    <a href="https://aws.amazon.com/">Amazon AWS</a>, <a href="https://www.amazon.science/">Amazon AGI</a>,
    <a href="https://www.salesforceairesearch.com/">Salesforce AI Research</a>, and
    <a href="https://www.grammarly.com/">Grammarly</a>.

