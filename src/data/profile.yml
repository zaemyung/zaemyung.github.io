role_line: Linguistic structure · metacognitive self-improvement · human-AI collaboration
thesis: I teach language models to write with <em>structure</em>, then to judge and <em>recursively improve</em> their own reasoning.
lead:
  - >-
    I am a Ph.D. candidate in the <a href="https://minnesotanlp.github.io/">Minnesota NLP</a> group at the
    University of Minnesota, advised by <a href="https://dykang.github.io/">Dongyeop Kang</a>. My research develops a
    <em>meta-scaffolding</em> paradigm for large language models: discourse-level structure as a training signal for
    coherent long-form generation, metacognitive feedback inside reinforcement learning to stabilize optimization, and
    test-time metacognition that lets agents recursively improve themselves.
  - >-
    Before the Ph.D. I worked on machine translation at NAVER LABS Europe and Papago, and I have interned at Amazon AWS,
    Amazon AGI, Salesforce AI Research, and Grammarly.

